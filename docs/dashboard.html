<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballista — Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1319; --panel:#161c25; --panel-2:#1c2430; --panel-3:#222c3a; --line:#2a3543;
  --ink:#e6ecf3; --ink-dim:#93a2b5; --ink-faint:#61728a;
  --amber:#e6a641; --amber-soft:#3a2f1a;
  --recon:#3fb6a8; --exploit:#e6a641; --cred:#e07d3a; --lateral:#e0524f; --impact:#c0435f;
  --allow:#43b581; --deny:#e0524f; --wait:#c9a227; --info:#5b8fd6;
  --crit:#e0524f; --high:#e07d3a; --med:#e6a641; --low:#5b8fd6;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --disp:"Chakra Petch","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#e9edf2; --panel:#ffffff; --panel-2:#f3f6f9; --panel-3:#e8edf3; --line:#d3dae3;
  --ink:#1a222d; --ink-dim:#4a5a6e; --ink-faint:#7688a0; --amber-soft:#f6ecd6;
}
*{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 상단 상태 바 ===== */
.topbar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) clamp(14px,3vw,22px) 10px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.05em}
.brand .g{color:var(--amber);text-shadow:0 0 16px rgba(230,166,65,.4)}
.eng{display:flex;flex-direction:column;line-height:1.25}
.eng .id{font-family:var(--mono);font-size:12px;color:var(--amber)}
.eng .nm{font-size:12px;color:var(--ink-dim)}
.status-pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.pill.ok{border-color:var(--allow);color:var(--allow)}
.pill.live{border-color:var(--amber);color:var(--amber)}
.pill .led{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.live .led{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
select{font-family:var(--body);font-size:12px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:6px 9px}

.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-position:center;opacity:1}
main{padding:clamp(14px,3vw,22px);max-width:1400px;margin:0 auto}

/* ===== KPI 스트립 ===== */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--amber))}
.kpi .lab{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.03em}
.kpi .val{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.1;margin-top:3px}
.kpi .val .u{font-size:13px;color:var(--ink-dim);font-weight:500;margin-left:3px}
.kpi .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);margin-top:3px}
.kpi .meta.crit{color:var(--crit)}

/* ===== 메인 레이아웃 ===== */
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
@media(max-width:960px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.card .ct{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.01em}
.card .cd{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.card .cb{padding:14px 15px}

/* ATT&CK 킬체인 (hero) */
.kc-track{display:flex;flex-direction:column;gap:11px}
.kc-row{display:grid;grid-template-columns:150px 1fr 62px;align-items:center;gap:12px}
@media(max-width:520px){.kc-row{grid-template-columns:110px 1fr 50px}}
.kc-row .tac{line-height:1.2}
.kc-row .tac .t{font-family:var(--disp);font-weight:600;font-size:12.5px}
.kc-row .tac .id{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.kc-bar{height:22px;background:var(--panel-2);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line)}
.kc-bar .fill{position:absolute;inset:0 auto 0 0;background:var(--kc);opacity:.85;border-radius:3px}
.kc-bar .att{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(255,255,255,.06) 5px,rgba(255,255,255,.06) 10px)}
.kc-row .num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);text-align:right}
.kc-row .num b{color:var(--ink)}

/* 액션 피드 */
.feed{display:flex;flex-direction:column}
.feed .fh{display:flex;gap:6px;padding:0 15px 10px;border-bottom:1px solid var(--line)}
.filt{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);cursor:pointer}
.filt[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.feed-list{max-height:340px;overflow-y:auto}
.evt{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer;transition:background .12s}
.evt:hover,.evt:focus-visible{background:var(--panel-2);outline:none}
.evt:focus-visible{box-shadow:inset 3px 0 0 var(--amber)}
.evt:last-child{border-bottom:0}
.evt .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.evt .desc .d1{color:var(--ink)}
.evt .desc .d2{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);margin-top:1px}
.evt .rc{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:3px;border:1px solid var(--line);white-space:nowrap}
.evt .rc.success{color:var(--allow);border-color:var(--allow)}
.evt .rc.blocked{color:var(--deny);border-color:var(--deny)}
.evt .rc.approval{color:var(--wait);border-color:var(--wait)}
.evt .rc.info{color:var(--info);border-color:var(--info)}
.tag-cls{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:2px;border:1px solid var(--line);color:var(--ink-faint);margin-left:6px}

/* 탐지 공백 */
.gap{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:0}
.gap .warn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--amber-soft);color:var(--deny);font-size:15px;flex-shrink:0}
.gap .gi{flex:1}
.gap .gi .g1{font-size:12.5px}
.gap .gi .g1 b{font-family:var(--mono);color:var(--deny)}
.gap .gi .g2{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:1px}

/* 취약점 */
.vuln{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vuln:last-child{border-bottom:0}
.sev{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:3px;text-align:center;min-width:56px}
.sev.crit{background:var(--crit);color:#1a0d0d}
.sev.high{background:var(--high);color:#1a100a}
.sev.med{background:var(--med);color:#1a150a}
.sev.low{background:var(--low);color:#0a1220}
.vuln .vi .v1{font-size:12.5px}
.vuln .vi .v2{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.vuln .host{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}

/* 스코프 */
.scope-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.scope-row:last-child{border-bottom:0}
.scope-row .k{color:var(--ink-dim);font-family:var(--mono);font-size:11px}
.scope-row .v{font-family:var(--mono);font-size:11.5px;text-align:right}
.scope-row .v.ok{color:var(--allow)}
.mono-list{font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.7;margin-top:4px}
.mono-list .oos{color:var(--deny)}
.verify-btn{width:100%;margin-top:12px;font-family:var(--disp);font-weight:600;font-size:12.5px;border:1px solid var(--allow);background:transparent;color:var(--allow);border-radius:5px;padding:9px;cursor:pointer;transition:background .15s}
.verify-btn:hover{background:rgba(67,181,129,.12)}
.verify-btn.done{background:var(--allow);color:#0d1a13}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* ===== 상세 드로어 ===== */
.scrim{position:fixed;inset:0;background:rgba(6,9,13,.62);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:40}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);box-shadow:-24px 0 60px -30px #000}
.drawer.on{transform:translateX(0)}
@media(max-width:560px){.drawer{width:100vw;top:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  transform:translateY(100%)}.drawer.on{transform:translateY(0)}}
.dw-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dw-head .meta{flex:1;min-width:0}
.dw-head .tm{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.dw-head .ttl{font-family:var(--disp);font-weight:600;font-size:16px;margin-top:3px;line-height:1.3}
.dw-head .rc{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;margin-top:2px}
.dw-head .rc.success{color:var(--allow);border-color:var(--allow)}
.dw-head .rc.blocked{color:var(--deny);border-color:var(--deny)}
.dw-head .rc.approval{color:var(--wait);border-color:var(--wait)}
.dw-head .rc.info{color:var(--info);border-color:var(--info)}
.dw-close{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;flex-shrink:0}
.dw-close:hover{color:var(--ink);border-color:var(--ink-dim)}
.dw-body{overflow-y:auto;padding:6px 18px 24px}
.dw-sec{padding:15px 0;border-bottom:1px solid var(--line)}
.dw-sec:last-child{border-bottom:0}
.dw-sec .lab{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:12px;color:var(--amber);letter-spacing:.02em;margin-bottom:7px}
.dw-sec .lab .ic{width:16px;text-align:center}
.dw-sec.def .lab{color:var(--recon)}
.dw-sec p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.65}
.dw-tags{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.dw-tags .t{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:3px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim)}

/* ===== 방어 어시스턴트 ===== */
.asst-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.asst-btn{font-family:var(--disp);font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;transition:border-color .12s,color .12s}
.asst-btn:hover{border-color:var(--amber);color:var(--amber)}
.asst-ask{display:flex;gap:8px;margin-bottom:12px}
.asst-ask input{flex:1;min-width:0;font-family:var(--body);font-size:13px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
.asst-ask input:focus{outline:none;border-color:var(--amber)}
.asst-out{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;min-height:60px;color:var(--ink)}
.asst-note{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:8px}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">BALL<span class="g">I</span>STA</span>
  <div class="eng">
    <span class="id" id="eng-id">ENG-2026-0042</span>
    <span class="nm" id="eng-nm">Q4 내부망 정기 점검</span>
  </div>
  <div class="status-pills">
    <span class="pill ok"><span class="led"></span>scope signed</span>
    <span class="pill live"><span class="led"></span>window active</span>
    <span class="pill" id="pill-class">class ≤ modify</span>
    <select aria-label="교전 선택">
      <option>ENG-2026-0042 · Q4 내부망</option>
      <option>ENG-2026-0031 · DMZ 점검</option>
    </select>
  </div>
</div>

<main>
  <!-- KPI -->
  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <!-- 좌 -->
    <div>
      <div class="card">
        <div class="ch"><span class="ct">ATT&CK 킬체인 커버리지</span><span class="cd">시도 ▨ · 성공 ▮</span></div>
        <div class="cb"><div class="kc-track" id="kc"></div></div>
      </div>
      <div class="card">
        <div class="ch"><span class="ct">액션 피드</span><span class="cd" id="feed-count"></span></div>
        <div class="feed">
          <div class="fh">
            <button class="filt" data-f="all" aria-pressed="true">전체</button>
            <button class="filt" data-f="success" aria-pressed="false">성공</button>
            <button class="filt" data-f="blocked" aria-pressed="false">차단</button>
          </div>
          <div class="feed-list" id="feed"></div>
        </div>
      </div>
    </div>

    <!-- 우 -->
    <div>
      <div class="card">
        <div class="ch"><span class="ct">탐지 공백</span><span class="cd">성공 · 미탐지</span></div>
        <div class="cb" id="gaps"></div>
      </div>
      <div class="card">
        <div class="ch"><span class="ct">발견 취약점</span><span class="cd" id="vuln-count"></span></div>
        <div class="cb" id="vulns"></div>
      </div>
      <div class="card">
        <div class="ch"><span class="ct">스코프 &amp; 정책</span><span class="cd">RoE-2026-Q4-v3</span></div>
        <div class="cb" id="scope"></div>
      </div>
    </div>
  </div>

  <div class="card" id="assistant-card">
    <div class="ch"><span class="ct">방어 어시스턴트</span><span class="cd">결과 해석 · ATT&CK 학습</span></div>
    <div class="cb">
      <div class="asst-actions">
        <button class="asst-btn" data-mode="summary">이번 교전 요약</button>
        <button class="asst-btn" data-mode="gaps">탐지 공백 방어법</button>
      </div>
      <div class="asst-ask">
        <input id="asst-q" placeholder="ATT&CK 기법을 방어 관점에서 물어보세요 (예: T1021.002는 어떻게 탐지하나?)">
        <button class="btn" id="asst-send">질문</button>
      </div>
      <div class="asst-out" id="asst-out">버튼을 누르거나 질문을 입력하세요. 수집된 결과 해석과 방어·ATT&CK 학습만 답합니다.</div>
      <div class="asst-note" id="asst-note"></div>
    </div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="액션 상세">
  <div class="dw-head">
    <div class="meta"><div class="tm" id="dw-tm"></div><div class="ttl" id="dw-ttl"></div></div>
    <span class="rc" id="dw-rc"></span>
    <button class="dw-close" id="dw-close" aria-label="닫기">✕</button>
  </div>
  <div class="dw-tags" id="dw-tags"></div>
  <div class="dw-body" id="dw-body"></div>
</aside>
<script>
/* ===== 목 데이터 ===== */
let KPI=[
  {lab:'EXECUTED ACTIONS',val:47,u:'',meta:'최근 5분 +3',kc:'--amber'},
  {lab:'SUCCESSFUL PATHS',val:6,u:'',meta:'app01 → db01',kc:'--allow'},
  {lab:'FINDINGS',val:11,u:'',meta:'critical 2 · high 4',metaCrit:true,kc:'--cred'},
  {lab:'DETECTION GAPS',val:3,u:'',meta:'미탐지 성공 기법',metaCrit:true,kc:'--deny'},
  {lab:'CHAIN INTEGRITY',val:'OK',u:'',meta:'47/47 verified',kc:'--allow'}
];
let KILLCHAIN=[
  {t:'Reconnaissance',id:'TA0043',c:'--recon',att:14,ok:14},
  {t:'Discovery',id:'TA0007',c:'--recon',att:9,ok:8},
  {t:'Initial Access',id:'TA0001',c:'--exploit',att:5,ok:2},
  {t:'Credential Access',id:'TA0006',c:'--cred',att:6,ok:3},
  {t:'Lateral Movement',id:'TA0008',c:'--lateral',att:4,ok:2},
  {t:'Impact',id:'TA0040',c:'--impact',att:0,ok:0}
];
let FEED=[
  {tm:'10:42:07',d1:'원격 서비스 이동 → db01',d2:'lateral · T1021.002',rc:'success',cls:'modify',f:'success',
   what:'app01에서 얻은 계정 정보로 db01에 원격으로 접속해 장악 범위를 옆으로 넓혔습니다. 새 취약점을 뚫은 게 아니라, 이미 가진 인증 정보로 정상 프로토콜처럼 들어간 것입니다.',
   why:'대상 db01이 허용 범위 안이고 시간창·기법·등급 검사를 모두 통과해 실행됐습니다. 이동 대상마다 스코프를 다시 확인합니다.',
   atk:'T1021.002 — 원격 서비스(SMB/관리 공유). 확보한 계정으로 다른 시스템의 관리 공유에 접속해 이동하는 기법.',

/* ===== 렌더 ===== */
const $=id=>document.getElementById(id);

/* ----- 상세 드로어 ----- */
function openDrawer(e){
  if(!e)return;
  $('dw-tm').textContent=e.tm+(e.cls?'  ·  action_class: '+e.cls:'');
  $('dw-ttl').textContent=e.d1;
  const rc=$('dw-rc');rc.className='rc '+e.rc;rc.textContent=e.rc.toUpperCase();
  $('dw-tags').innerHTML=e.d2.split(' · ').map(t=>`<span class="t">${t}</span>`).join('');
  $('dw-body').innerHTML=`
    <div class="dw-sec"><div class="lab"><span class="ic">▸</span>무슨 일이 있었나</div><p>${e.what}</p></div>
    <div class="dw-sec"><div class="lab"><span class="ic">⚖</span>왜 이 결과인가</div><p>${e.why}</p></div>
    <div class="dw-sec"><div class="lab"><span class="ic">◈</span>ATT&CK 맥락</div><p>${e.atk}</p></div>
    <div class="dw-sec def"><div class="lab"><span class="ic">🛡</span>방어 관점 (SOC에서 어떻게 보나)</div><p>${e.def}</p></div>`;
  $('scrim').classList.add('on');$('drawer').classList.add('on');
}
function closeDrawer(){$('scrim').classList.remove('on');$('drawer').classList.remove('on');}
$('scrim').addEventListener('click',closeDrawer);
$('dw-close').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

function renderFeed(filter='all'){
  const items=FEED.filter(e=>filter==='all'||(filter==='success'&&e.rc==='success')||(filter==='blocked'&&e.rc==='blocked'));
  $('feed').innerHTML=items.map(e=>`<div class="evt" data-idx="${FEED.indexOf(e)}" role="button" tabindex="0">
    <span class="tm">${e.tm}</span>
    <div class="desc"><div class="d1">${e.d1}${e.cls?`<span class="tag-cls">${e.cls}</span>`:''}</div><div class="d2">${e.d2}</div></div>
    <span class="rc ${e.rc}">${e.rc.toUpperCase()}</span></div>`).join('');
  $('feed-count').textContent=`${items.length} events · 클릭해 상세보기`;
  $('feed').querySelectorAll('.evt').forEach(el=>{
    const open=()=>openDrawer(FEED[+el.dataset.idx]);
    el.addEventListener('click',open);
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open();}});
  });
}

function renderScope(){
  const s=SCOPE||{};
  $('scope').innerHTML=`
    <div class="scope-row"><span class="k">time window</span><span class="v ${s.time_window==='active'?'ok':''}">${s.time_window||'-'}</span></div>
    <div class="scope-row"><span class="k">max class</span><span class="v">${s.max_class||'-'}</span></div>
    <div class="scope-row"><span class="k">approver</span><span class="v">${s.approver||'-'}</span></div>
    <div class="scope-row"><span class="k">signature</span><span class="v ok">${s.signature||'-'}</span></div>
    <div class="scope-row" style="display:block"><span class="k">in-scope</span>
      <div class="mono-list">${(s.in_scope||[]).join('<br>')}</div></div>
    <div class="scope-row" style="display:block"><span class="k">out-of-scope</span>
      <div class="mono-list oos">${(s.out_of_scope||[]).join('<br>')}</div></div>
    <button class="verify-btn" id="vbtn">▸ evidence 체인 무결성 검증</button>`;
  $('vbtn').addEventListener('click',function(){
    this.textContent='✓ 레코드 검증 완료 — 체인 무결';this.classList.add('done');
  });
}

function renderAll(){
  const eid=$('eng-id'),enm=$('eng-nm'),pc=$('pill-class');
  if(ENGAGEMENT){if(eid&&ENGAGEMENT.id)eid.textContent=ENGAGEMENT.id;
    if(enm&&ENGAGEMENT.name)enm.textContent=ENGAGEMENT.name;
    if(pc&&ENGAGEMENT.max_class)pc.textContent='class ≤ '+ENGAGEMENT.max_class;}

  $('kpis').innerHTML=KPI.map(k=>`<div class="kpi" style="--kc:var(${k.kc})">
    <div class="lab">${k.lab}</div>
    <div class="val">${k.val}${k.u?`<span class="u">${k.u}</span>`:''}</div>
    <div class="meta ${k.metaCrit?'crit':''}">${k.meta}</div></div>`).join('');

  $('kc').innerHTML=KILLCHAIN.map(r=>{
    const attPct=r.att?Math.min(100,r.att/16*100):3;
    const okPct=r.att?r.ok/r.att*attPct:0;
    return `<div class="kc-row">
      <div class="tac"><div class="t">${r.t}</div><div class="id">${r.id}</div></div>
      <div class="kc-bar" style="--kc:var(${r.c})">
        <div class="att" style="width:${attPct}%"></div>
        <div class="fill" style="width:${okPct}%"></div>
      </div>
      <div class="num"><b>${r.ok}</b>/${r.att}</div></div>`;
  }).join('');

  renderFeed();

  $('gaps').innerHTML=GAPS.map(g=>`<div class="gap">
    <div class="warn">⚠</div>
    <div class="gi"><div class="g1"><b>${g.id}</b> — ${g.txt}</div><div class="g2">${g.meta}</div></div></div>`).join('');

  $('vuln-count').textContent=`${VULNS.length} findings`;
  $('vulns').innerHTML=VULNS.map(v=>`<div class="vuln">
    <span class="sev ${v.sev}">${v.sev.toUpperCase()}</span>
    <div class="vi"><div class="v1">${v.v1}</div><div class="v2">${v.v2}</div></div>
    <span class="host">${v.host}</span></div>`).join('');

  renderScope();
}

/* 필터 버튼(한 번만 연결) */
document.querySelectorAll('.filt').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filt').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderFeed(b.dataset.f);
}));

/* dashboard.json 라이브 로드 → 있으면 실데이터, 없으면 내장 목업으로 폴백 */
(async()=>{
  try{
    const r=await fetch('dashboard.json',{cache:'no-store'});
    if(r.ok){
      const d=await r.json();
      if(d.KPI)KPI=d.KPI; if(d.KILLCHAIN)KILLCHAIN=d.KILLCHAIN; if(d.FEED)FEED=d.FEED;
      if(d.GAPS)GAPS=d.GAPS; if(d.VULNS)VULNS=d.VULNS; if(d.SCOPE)SCOPE=d.SCOPE;
      if(d.engagement)ENGAGEMENT=d.engagement;
    }
  }catch(e){/* 폴백: 내장 목업 유지 */}
  renderAll();
})();

/* ===== 방어 어시스턴트 (sample capability) ===== */
const ASST_ROLE="너는 Ballista의 방어 분석 어시스턴트다. 이미 수집된 침투 테스트 결과(evidence)를 해석·요약하고, ATT&CK 기법을 방어자(SOC) 관점에서 설명한다. 규칙: 공격의 다음 단계, 익스플로잇 방법, 페이로드, 특정 대상을 어떻게 공격·침투하는지는 절대 제시하지 않는다. 그런 요청이 오면 정중히 거절하고 방어·탐지 관점으로 돌린다. 답변은 한국어로 간결하게.";
let _sample=null,_sampleTried=false;
async function getSample(){
  if(_sampleTried)return _sample;
  _sampleTried=true;
  try{_sample=(window.claude&&claude.use)?await claude.use("sample"):null;}catch(e){_sample=null;}
  if(!_sample)$('asst-note').textContent="LLM 어시스턴트는 claude.ai에 publish된 페이지에서만 동작합니다.";
  return _sample;
}
function asstCtx(){
  return JSON.stringify({KPI,KILLCHAIN,GAPS,VULNS,FEED:FEED.map(f=>({tm:f.tm,d1:f.d1,d2:f.d2,rc:f.rc}))});
}
async function askAssistant(input){
  const out=$('asst-out'),s=await getSample();
  if(!s){out.textContent="어시스턴트를 사용할 수 없습니다 (publish된 페이지에서 열어주세요).";return;}
  out.textContent="Thinking…";
  try{
    const res=await s(input,{modelTier:"default",onText:({text})=>{out.textContent=text;}});
    out.textContent=res.text;
  }catch(e){
    out.textContent="요청을 처리하지 못했습니다: "+((e&&e.message)||e);
  }
}
document.querySelectorAll('.asst-btn').forEach(b=>b.addEventListener('click',()=>{
  const mode=b.dataset.mode;
  const prompt = mode==='summary'
    ? ASST_ROLE+"\n\n다음은 이번 교전의 요약 데이터다:\n"+asstCtx()+"\n\n무슨 일이 있었고 방어 관점에서 무엇이 중요한지 6~8줄로 요약해줘."
    : ASST_ROLE+"\n\n다음은 탐지 공백(성공했으나 미탐지) 목록이다:\n"+JSON.stringify(GAPS)+"\n\n각 항목을 어떤 로그·탐지 룰·완화책으로 메우면 좋을지 항목별 방어 권고로 제시해줘.";
  askAssistant(prompt);
}));
$('asst-send').addEventListener('click',()=>{
  const q=$('asst-q').value.trim();
  if(q)askAssistant(ASST_ROLE+"\n\n사용자 질문(ATT&CK·방어 학습): "+q);
});
$('asst-q').addEventListener('keydown',e=>{if(e.key==='Enter')$('asst-send').click();});
